name: Deployment and tests
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      LAURAPHYSICS_DISABLE_LEGACY_CONFIG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-tested.txt
            requirements-test.txt
      - name: Restore image cache
        uses: actions/cache@v4
        with:
          path: |
            static/bank
            static/paper
            static/repair-images
          key: opbp-${{ runner.os }}-${{ hashFiles('data/asset-manifest.json') }}
      - name: Install checksum-pinned image release
        run: python scripts/bootstrap_assets.py --verify
      - name: Install locked test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install standard Chromium
        run: python -m playwright install --with-deps chromium
      - name: Environment and assets
        run: python environment_check.py
      - name: Public source safety checks
        run: python scripts/check_public_source.py
      - name: Unit, HTTP, browser and export acceptance (no real model calls)
        run: python scripts/run_tests.py --output test-results
      - name: Upload test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ runner.os }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            test-results/test-result.json
            test-results/junit.xml
            test-results/test-output.txt
            test-results/coverage.json
            test-results/coverage-html
            test-results/evidence
